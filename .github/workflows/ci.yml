name: CI

# Verification CI: runs for code/build changes only. Docs, Claude files and
# repo metadata are ignored.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The version pinned in .clang-format: other versions format differently.
      - name: Install clang-format
        run: |
          pipx install "clang-format==$(sed -n 's/^# clang-format-version: *\([0-9.]*\).*/\1/p' template/.clang-format).*"

      # On the full projects, as instantiated from the template.
      - name: Check
        run: |
          cmake -S tests -B .build/tests
          ctest --test-dir .build/tests -R '_(copy|format)$' --output-on-failure

  build:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        # Sanitizers + warnings as errors in one build per compiler.
        preset: [debug-sanitizers-strict]

    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}

    steps:
      - uses: actions/checkout@v4

      # libcurl + OpenSSL: cpr uses the system curl (CPR_USE_SYSTEM_CURL=ON)
      # and needs an SSL backend. libclang-rt: clang's sanitizer runtimes.
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache mold libcurl4-openssl-dev libssl-dev libclang-rt-18-dev

      # Dependency sources are reused when their stamp (URL, TAG, PATCH) matches,
      # so a stale cache only costs a re-fetch of the deps that changed.
      - name: Cache dependency sources
        uses: actions/cache@v4
        with:
          path: |
            tests/.deps
            .build/tests/*/.deps
          key: deps-${{ hashFiles('template/cmake/**', 'tests/fixtures/*/cmake/**') }}
          restore-keys: deps-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .build/tests/ccache
          key: ccache-${{ matrix.compiler }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.compiler }}-${{ matrix.preset }}-

      # Fixtures, and the full projects built with the template's preset.
      - name: Test
        run: |
          cmake -S tests -B .build/tests -D PX_TEST_PRESET=${{ matrix.preset }}
          ctest --test-dir .build/tests -j 4 -E '_format$' --output-on-failure
