name: CI

# Verification CI: runs for code/build changes only. Docs, Claude files and
# repo metadata are ignored.
on:
  push:
    branches: [main]
    # Path filters don't apply to tags.
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A release tag must name the version px reports (the template's matches it,
  # checked by the tests' configure).
  version:
    name: version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches framework/version.cmake
        run: |
          version="$(sed -n 's/^set(PX_VERSION \([0-9.]*\))/\1/p' framework/version.cmake)"
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }

  format:
    name: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The version pinned in .clang-format: other versions format differently.
      - name: Install clang-format
        run: |
          pipx install "clang-format==$(sed -n 's/^# clang-format-version: *\([0-9.]*\).*/\1/p' template/.clang-format).*"

      # On the full projects, as instantiated from the template.
      - name: Check
        run: |
          cmake -S tests -B .build/tests
          ctest --test-dir .build/tests -R '_(copy|format)$' --output-on-failure

  build:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        # Sanitizers + warnings as errors in one build per compiler.
        preset: [debug-sanitizers-strict]

    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}

    steps:
      - uses: actions/checkout@v4

      # libcurl + OpenSSL: cpr uses the system curl (CPR_USE_SYSTEM_CURL=ON)
      # and needs an SSL backend. libclang-rt: clang's sanitizer runtimes.
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache mold libcurl4-openssl-dev libssl-dev libclang-rt-18-dev

      # Dependency sources are reused when their stamp (URL, TAG, PATCH) matches,
      # so a stale cache only costs a re-fetch of the deps that changed.
      - name: Cache dependency sources
        uses: actions/cache@v4
        with:
          path: |
            tests/.deps
            .build/tests/*/.deps
          key: deps-${{ hashFiles('tests/fixtures/*/cmake/**') }}
          restore-keys: deps-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .build/tests/ccache
          key: ccache-${{ matrix.compiler }}-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.compiler }}-${{ matrix.preset }}-

      # Fixtures, and the full projects built with the template's preset.
      - name: Test
        run: |
          cmake -S tests -B .build/tests -D PX_TEST_PRESET=${{ matrix.preset }}
          ctest --test-dir .build/tests -j 4 -E '_format$' --output-on-failure

  # A green release tag becomes a GitHub Release: its CHANGELOG section as
  # notes, and new.cmake + its new.sh / new.ps1 wrappers pinned to the tag,
  # so releases/latest/download/new.* always starts from a tested release.
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, format, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## ${version}" '$0 == head { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          sed -i "s/^set(__release_tag \"\")$/set(__release_tag ${GITHUB_REF_NAME})/" new.cmake
          grep -q "^set(__release_tag ${GITHUB_REF_NAME})$" new.cmake
          for wrapper in new.sh new.ps1; do
            sed -i "s|releases/latest/download/new.cmake|releases/download/${GITHUB_REF_NAME}/new.cmake|" "${wrapper}"
            grep -q "releases/download/${GITHUB_REF_NAME}/new.cmake" "${wrapper}"
          done
          gh release create "${GITHUB_REF_NAME}" new.cmake new.sh new.ps1 --title "${GITHUB_REF_NAME}" --notes-file notes.md
